<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小说搜索阅读</title>
<style>
:root{
  --bg:#f6f5f4;--card:#fff;--tx:#262626;--tx2:#8a8a8a;--line:#eee;
  --brand:#2f9e6e;--brand2:#eaf6f0;--mask:rgba(0,0,0,.45);
}
html.night{
  --bg:#121212;--card:#1e1e1e;--tx:#d8d8d8;--tx2:#8a8a8a;--line:#2a2a2a;
  --brand:#3fae7e;--brand2:#1c2a24;--mask:rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 12px;display:flex;gap:8px;align-items:center}
.top .sbox{flex:1;display:flex;background:var(--bg);border-radius:8px;padding:8px 10px}
.top input{flex:1;border:none;outline:none;background:none;color:var(--tx)}
.top .btn{padding:8px 10px;border-radius:8px;background:var(--brand2);color:var(--brand);font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.book{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:12px;margin-bottom:10px}
.book img{width:64px;height:88px;object-fit:cover;border-radius:6px;background:var(--bg)}
.book .info{flex:1;min-width:0}
.book h3{font-size:16px;margin-bottom:2px}
.book .meta{color:var(--tx2);font-size:13px;margin-bottom:4px}
.book .intro{color:var(--tx2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--tx2);text-align:center;padding:60px 0}
.detail{background:var(--card);border-radius:12px;padding:14px}
.detail .hd{display:flex;gap:14px}
.detail img{width:96px;height:132px;object-fit:cover;border-radius:8px;background:var(--bg)}
.detail h2{font-size:19px;margin-bottom:6px}
.detail .meta{color:var(--tx2);font-size:13px;margin-bottom:8px}
.detail .intro{color:var(--tx2);font-size:14px;margin:12px 0}
.ops{display:flex;gap:10px;margin-top:14px}
.ops .p{flex:1;padding:11px 0;border-radius:10px;background:var(--brand);color:#fff;text-align:center;font-size:15px}
.ops .g{flex:1;padding:11px 0;border-radius:10px;background:var(--brand2);color:var(--brand);text-align:center;font-size:15px}
.ops .g[disabled]{opacity:.5}
.bar{margin-top:14px;display:none}
.bar .track{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;width:0;background:var(--brand);transition:width .2s}
.bar .txt{color:var(--tx2);font-size:12px;margin-top:5px;text-align:center}
.rtop{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;
  background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;transform:translateY(-100%);transition:.25s}
.rtop.show{transform:none}
.rtop .t{flex:1;font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbody{max-width:720px;margin:0 auto;padding:20px 6% 120px;display:none}
.rbody.show{display:block}
.rbody h2{font-size:18px;margin-bottom:16px}
.rbody .ct{font-size:17px;line-height:1.9;white-space:pre-wrap}
.rnav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:10px;
  transform:translateY(100%);transition:.25s}
.rnav.show{transform:none}
.rnav button{flex:1;padding:10px 0;border-radius:9px;background:var(--brand2);color:var(--brand);font-size:14px}
.rnav button:disabled{opacity:.4}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--mask);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;display:none;max-width:80vw;text-align:center}
.load{text-align:center;color:var(--tx2);padding:30px 0}
.back{padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}
</style>
</head>
<body>

<div class="top" id="topbar">
  <div class="sbox">
    <input id="kw" placeholder="搜索书名或作者" enterkeyhint="search">
  </div>
  <button class="btn" id="btnSearch">搜索</button>
  <button class="btn" id="btnNight" title="夜间模式">🌙</button>
</div>

<div class="wrap" id="listView">
  <div class="empty" id="listTip">输入书名开始搜索</div>
  <div id="list"></div>
</div>

<div class="wrap" id="detailView" style="display:none">
  <button class="back" onclick="showList()">← 返回</button>
  <div class="detail" style="margin-top:12px">
    <div class="hd">
      <img id="dCover" alt="">
      <div>
        <h2 id="dTitle"></h2>
        <div class="meta" id="dMeta"></div>
        <div class="meta" id="dCount"></div>
      </div>
    </div>
    <div class="intro" id="dIntro"></div>
    <div class="ops">
      <button class="p" id="btnRead">开始阅读</button>
      <button class="g" id="btnDl">下载整本 TXT</button>
    </div>
    <div class="bar" id="dlBar">
      <div class="track"><div class="fill" id="dlFill"></div></div>
      <div class="txt" id="dlTxt"></div>
    </div>
  </div>
</div>

<div class="rtop" id="rtop">
  <button class="back" onclick="closeReader()">← 书页</button>
  <div class="t" id="rTitle"></div>
  <button class="btn" onclick="openCata()">目录</button>
</div>
<div class="rbody" id="rbody"><h2 id="rH"></h2><div class="ct" id="rCt"></div></div>
<div class="rnav" id="rnav">
  <button id="rPrev">上一章</button>
  <button id="rNext">下一章</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 纯浏览器直连番茄聚合 API（服务端已开放 CORS:*） ============ */
const API = 'https://fq.taijiwang.top';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let toastTimer = null;
function toast(msg, ms = 2200){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  if (ms > 0) toastTimer = setTimeout(() => t.style.display = 'none', ms);
}

async function api(path, params){
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${API}${path}?${qs}`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.code !== 200) throw new Error(j.message || '接口错误');
  return j.data;
}

/* ============ 搜索 ============ */
let lastQuery = '';
async function doSearch(){
  const kw = $('#kw').value.trim();
  if (!kw) return;
  lastQuery = kw;
  $('#listTip').textContent = '搜索中…';
  $('#list').innerHTML = '';
  showList();
  try{
    const d = await api('/api/search', { key: kw });
    const blocks = d?.search_tabs?.[0]?.data || [];
    const books = [];
    for (const b of blocks){
      for (const it of (b.book_data || [])){
        if (it && it.book_id && it.book_name) books.push(it);
      }
    }
    if (!books.length){ $('#listTip').textContent = '没有找到相关书籍'; return; }
    $('#listTip').textContent = `找到 ${books.length} 本（点卡片查看详情）`;
    $('#list').innerHTML = books.map(b => `
      <div class="book" onclick="openDetail('${b.book_id}')">
        <img loading="lazy" src="${esc(b.thumb_url||'')}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <h3>${esc(b.book_name)}</h3>
          <div class="meta">${esc(b.author||'佚名')}${b.category?' · '+esc(b.category):''}</div>
          <div class="intro">${esc(b.abstract||'')}</div>
        </div>
      </div>`).join('');
  }catch(e){
    $('#listTip').textContent = '搜索失败：' + e.message + '（接口临时不可用请稍后再试）';
  }
}

/* ============ 详情 ============ */
let book = null, chapters = [];
async function openDetail(id){
  showDetail();
  $('#dTitle').textContent = '加载中…';
  $('#dIntro').textContent = ''; $('#dMeta').textContent = ''; $('#dCount').textContent = '';
  $('#dCover').removeAttribute('src');
  $('#btnDl').disabled = true; $('#dlBar').style.display = 'none';
  try{
    const d = await api('/api/detail', { book_id: id });
    book = d?.data || {};
    book.book_id = id;
    $('#dTitle').textContent = book.book_name || '未知书名';
    $('#dMeta').textContent = `${book.author||'佚名'}${book.category?' · '+book.category:''}`;
    $('#dCount').textContent = book.serial_count ? `共 ${book.serial_count} 章` : '';
    $('#dIntro').textContent = book.abstract || '（无简介）';
    if (book.thumb_url) $('#dCover').src = book.thumb_url;
    loadChapters();
  }catch(e){
    $('#dTitle').textContent = '加载失败';
    $('#dIntro').textContent = e.message;
  }
}

async function loadChapters(){
  try{
    const d = await api('/api/directory', { book_id: book.book_id });
    chapters = (d?.lists || []).map(c => ({ title: c.title, item_id: String(c.item_id) }));
    if (chapters.length) $('#btnDl').disabled = false;
    if (book && !$('#dCount').textContent) $('#dCount').textContent = `共 ${chapters.length} 章`;
  }catch(e){ chapters = []; }
}

/* ============ 阅读器 ============ */
let rIdx = -1;
async function openReader(i){
  if (!chapters.length){ toast('目录未就绪'); return; }
  rIdx = Math.max(0, Math.min(chapters.length - 1, i));
  $('#rtop').classList.add('show'); $('#rnav').classList.add('show');
  $('#rbody').classList.add('show');
  $('#listView').style.display = 'none'; $('#detailView').style.display = 'none';
  $('#rTitle').textContent = chapters[rIdx].title;
  $('#rH').textContent = chapters[rIdx].title;
  $('#rCt').textContent = '加载中…';
  $('#rPrev').disabled = rIdx === 0;
  $('#rNext').disabled = rIdx === chapters.length - 1;
  window.scrollTo(0, 0);
  try{
    const d = await api('/api/content', { tab: '小说', item_id: chapters[rIdx].item_id });
    const c = d?.content;
    $('#rCt').textContent = c || '（本章内容为空）';
    if (!c) toast('本章内容为空或接口失败');
  }catch(e){ $('#rCt').textContent = '加载失败：' + e.message; }
}
function closeReader(){
  $('#rtop').classList.remove('show'); $('#rnav').classList.remove('show');
  $('#rbody').classList.remove('show');
  showDetail();
}
function openCata(){
  if (!chapters.length){ toast('目录未就绪'); return; }
  const lines = chapters.map((c, i) => `${i+1}. ${c.title}`).join('\n');
  const n = prompt(`共 ${chapters.length} 章\n输入章节序号跳转：`, String(rIdx + 1));
  if (n !== null){
    const k = parseInt(n, 10);
    if (k >= 1 && k <= chapters.length) openReader(k - 1);
  }
}
$('#rPrev').onclick = () => openReader(rIdx - 1);
$('#rNext').onclick = () => openReader(rIdx + 1);

/* ============ 整本下载（浏览器内并发抓取→合并 TXT） ============ */
let dlBusy = false;
async function downloadBook(){
  if (dlBusy || !chapters.length) return;
  dlBusy = true;
  $('#btnDl').disabled = true;
  $('#dlBar').style.display = 'block';
  const total = chapters.length;
  const out = new Array(total);
  const failed = [];
  let done = 0, idx = 0;
  const CONC = 4;
  const prog = () => {
    $('#dlFill').style.width = (done / total * 100).toFixed(1) + '%';
    $('#dlTxt').textContent = `已抓取 ${done}/${total} 章`;
  };
  async function worker(){
    while (idx < total){
      const i = idx++;
      let ok = false;
      for (let t = 0; t < 3 && !ok; t++){
        try{
          const d = await api('/api/content', { tab: '小说', item_id: chapters[i].item_id });
          if (d?.content){
            out[i] = `\n== ${chapters[i].title} ==\n\n${d.content}\n`;
            ok = true;
          }
        }catch(e){ await sleep(600 * (t + 1)); }
      }
      if (!ok){ out[i] = `\n== ${chapters[i].title} ==\n\n（本章抓取失败）\n`; failed.push(i); }
      done++; prog();
      await sleep(120);
    }
  }
  toast(`开始下载《${book.book_name}》共 ${total} 章，请保持页面打开`);
  await Promise.all(Array.from({ length: CONC }, worker));
  const header = `《${book.book_name}》\n作者：${book.author||'佚名'}\n来源：番茄聚合API（网页版）\n` +
    `章节数：${total}（失败 ${failed.length}）\n下载时间：${new Date().toLocaleString()}\n${'='.repeat(32)}\n`;
  const blob = new Blob([header + out.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${book.book_name}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  $('#dlTxt').textContent = failed.length ? `完成，${failed.length} 章失败（已留占位）` : '下载完成';
  toast(failed.length ? `完成：${failed.length} 章抓取失败` : '整本下载完成');
  dlBusy = false; $('#btnDl').disabled = false;
}

/* ============ 视图切换 / 主题 / 事件 ============ */
function showList(){
  $('#detailView').style.display = 'none';
  $('#listView').style.display = 'block';
  if (lastQuery && !$('#list').children.length && $('#listTip').textContent.includes('开始'))
    $('#listTip').textContent = '输入书名开始搜索';
}
function showDetail(){
  $('#listView').style.display = 'none';
  $('#detailView').style.display = 'block';
  window.scrollTo(0, 0);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'"',"'":'&#39;'}[c]));
}
$('#btnSearch').onclick = doSearch;
$('#kw').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
$('#btnRead').onclick = () => openReader(0);
$('#btnDl').onclick = downloadBook;
$('#btnNight').onclick = () => {
  document.documentElement.classList.toggle('night');
  localStorage.night = document.documentElement.classList.contains('night') ? '1' : '';
};
if (localStorage.night) document.documentElement.classList.add('night');
</script>

</body>
</html>
