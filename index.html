<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小说下载助手</title>
<style>
/* ===== 设计令牌：取值来自 Legado Web 源码（浅/夜双主题） ===== */
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e3e3; --text:#33373d; --sub:#6b6b6b;
  --muted:#969ba3; --acc:#1a8cff; --acc2:#e8f2ff;
  --r-md:10px;
}
html.night{
  --bg:#161819; --panel:#454545; --line:#5a5a5a; --text:#aeaeae; --sub:#9a9a9a;
  --muted:#8b8b8b; --acc:#4da3ff; --acc2:#3d4548;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}
.hide{display:none!important}

/* ===== 骨架：左侧栏 + 主区 ===== */
.layout{display:flex;height:100%}
.sidebar{width:252px;min-width:252px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:32px 26px 20px;overflow-y:auto;z-index:20}
.brand{font-size:22px;font-weight:500;margin-bottom:10px}
.brand-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.search-wrap{position:relative;margin-bottom:24px}
.search-input{width:100%;padding:11px 38px 11px 16px;border:1px solid var(--line);border-radius:50px;font-size:14px;background:var(--panel);color:var(--text);outline:none;transition:.15s}
.search-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.35;font-size:14px;pointer-events:none}
.side-label{font-size:12px;color:var(--muted);margin-bottom:10px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{padding:5px 12px;border-radius:50px;border:1px solid var(--line);font-size:12.5px;color:var(--sub);cursor:pointer;background:var(--panel)}
.chip .n{font-size:11px;opacity:.7;margin-left:2px}
.chip:hover,.chip.active{border-color:var(--acc);color:var(--acc)}
.chip.active{background:var(--acc2)}
.side-list{flex:1;min-height:80px;overflow-y:auto;margin-bottom:16px}
.side-item{display:flex;align-items:center;gap:8px;padding:7px 6px;font-size:12.5px;color:var(--sub);cursor:pointer;border-radius:8px}
.side-item:hover{background:var(--acc2)}
.side-actions{display:flex;flex-direction:column;gap:8px}
.side-btn{padding:9px;text-align:center;border-radius:9px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.side-btn:hover{border-color:var(--acc);color:var(--acc)}

.main{flex:1;overflow-y:auto;padding:34px 34px 60px}
.main::-webkit-scrollbar{width:0}

/* ===== 书架网格（Legado: auto-fill 定宽卡片） ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,360px));justify-content:space-around;gap:16px 10px;max-width:1240px;margin:0 auto}

/* ===== 结果卡片（结构复刻 Legado .book：封面84x112 + info纵排） ===== */
.card{user-select:none;display:flex;cursor:pointer;padding:14px 16px;border-radius:10px;width:100%;max-width:364px;margin:0 auto;transition:background .25s;position:relative}
.card:hover{background:rgba(0,0,0,.06)}
html.night .card:hover{background:rgba(255,255,255,.05)}
.cover-img,.cover-fb{width:84px;height:112px;min-width:84px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.cover-img{object-fit:cover;background:linear-gradient(135deg,var(--acc2),var(--panel))}
.cover-fb{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:var(--muted);background:linear-gradient(135deg,var(--acc2),var(--panel))}
.info{display:flex;flex-direction:column;justify-content:space-around;height:112px;margin-left:18px;flex:1;overflow:hidden;min-width:0}
.bname{font-size:16px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.sub{display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--sub);min-width:0}
.author{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{margin:0 7px;flex:none}
.last-chapter{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intro-line{color:var(--muted);font-size:13px;margin-top:2px;-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;word-wrap:break-word;overflow:hidden}
.nosrc{position:absolute;top:10px;right:12px;font-size:11px;padding:3px 9px;border-radius:50px;background:var(--acc2);color:var(--acc);font-weight:600;z-index:2}
.tagline{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;min-height:0}
.minitag{font-size:10.5px;padding:2px 8px;border-radius:50px;background:var(--acc2);color:var(--acc);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}

/* 空态/加载提示 */
.tip{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.stopwrap{text-align:center;margin:18px 0 6px}
.stopbtn{padding:9px 34px;border-radius:50px;background:var(--acc);color:#fff;font-size:13.5px}
.stopbtn:active{opacity:.85}

/* ===== 详情页 ===== */
.detail{max-width:1040px;margin:0 auto}
.backbar{margin-bottom:22px}
.backbtn{font-size:20px;color:var(--sub);padding:4px 10px;border-radius:8px}
.backbtn:hover{background:var(--acc2)}
.dhero{display:flex;gap:30px;flex-wrap:wrap}
.dcover{width:170px;height:230px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,var(--acc2),var(--panel));box-shadow:0 10px 28px rgba(0,0,0,.16);flex:none}
.dmeta{flex:1;min-width:280px;display:flex;flex-direction:column}
.dtitle{font-size:23px;font-weight:700;margin-bottom:10px;line-height:1.35}
.dinfo{color:var(--sub);font-size:13.5px;line-height:2}
.dintro{margin-top:14px;color:var(--muted);font-size:13.5px;line-height:1.9;overflow-y:auto;max-height:180px;white-space:pre-wrap}
.dbtns{display:flex;gap:10px;margin-top:auto;padding-top:18px;flex-wrap:wrap}
.btn{padding:10px 26px;border-radius:50px;font-size:14px;border:1px solid var(--line);color:var(--sub);background:var(--panel)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.55;cursor:not-allowed}
.srcrow{margin-top:16px;font-size:12.5px;color:var(--muted)}
.srcitem{display:inline-block;padding:4px 12px;margin:3px 6px 3px 0;border-radius:50px;border:1px solid var(--line);cursor:pointer}
.srcitem.cur{background:var(--acc);border-color:var(--acc);color:#fff}

/* 目录抽屉（右侧滑出，参考 Legado popCatalog） */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
.mask.show{opacity:1;visibility:visible;pointer-events:auto}
.drawer{position:fixed;top:0;right:-86%;width:84%;max-width:420px;height:100%;background:var(--panel);z-index:41;transition:right .25s;display:flex;flex-direction:column;box-shadow:-12px 0 34px rgba(0,0,0,.18);pointer-events:none;visibility:hidden}
.drawer.show{right:0;pointer-events:auto;visibility:visible}
.drawer-hd{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.drawer-title{font-size:15px;font-weight:600}
.reversedot{font-size:12.5px;color:var(--acc);cursor:pointer;display:flex;align-items:center;gap:4px}
.toclist{flex:1;overflow-y:auto;padding:6px 0 20px}
.toc-item{padding:12px 22px;font-size:13.5px;color:var(--sub);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{background:var(--acc2)}
.toc-item.cur{color:var(--acc);background:var(--acc2)}
.tocload{text-align:center;color:var(--muted);font-size:12.5px;padding:40px 0}

/* ===== 阅读器（正文最高优先级，工具栏覆盖式，参考 activity_book_read） ===== */
.reader{position:fixed;inset:0;background:var(--panel);z-index:60;display:flex;flex-direction:column}
.rt-head{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:62}
.rt-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rt-btn{padding:7px 12px;border-radius:8px;font-size:13px;color:var(--sub)}
.rt-btn:hover{background:var(--acc2)}
.rcontent{flex:1;overflow-y:auto;padding:64px 8% 90px;font-size:17.5px;line-height:1.95;letter-spacing:.2px;color:var(--text)}
.rcontent p{margin:0 0 1em;text-align:justify}
.rchap{font-size:19px;font-weight:700;margin-bottom:1.2em;color:var(--text)}
.rb-foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--panel);border-top:1px solid var(--line);z-index:62;font-size:13px;color:var(--sub)}
.rmenu-btn{padding:9px 18px;border-radius:9px;background:var(--acc2);color:var(--acc);font-size:13.5px}
.reading .rt-head,.reading .rb-foot{transform:translateY(-110%)}
.reading .rb-foot{transform:translateY(110%)}
.rt-head,.rb-foot{transition:transform .25s}
.reading .rcontent{padding-bottom:30px}

/* 弹窗（换源/书源管理/导入） */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:520px;max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{padding:16px 20px 10px;font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal-bd{padding:4px 20px 18px;overflow-y:auto}
.srcbtn{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;font-size:13.5px;color:var(--sub)}
.srcbtn b{color:var(--text);display:block;margin-bottom:2px;font-size:14px}
.srcbtn:hover{border-color:var(--acc)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--panel);color:var(--text);outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
toast{display:none}
#toast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);background:rgba(30,34,40,.88);color:#fff;font-size:13.5px;padding:10px 22px;border-radius:50px;z-index:99;pointer-events:none;transition:opacity .25s;opacity:0}
#toast.show{opacity:1}
.loading-bar{height:3px;background:var(--acc2);border-radius:2px;overflow:hidden;margin-bottom:14px;max-width:1240px;margin-left:auto;margin-right:auto}
.loading-bar i{display:block;height:100%;width:30%;background:var(--acc);border-radius:2px;animation:lmove 1.1s infinite}
@keyframes lmove{0%{margin-left:-30%}100%{margin-left:100%}}

/* ===== 移动端 ===== */
@media(max-width:720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;min-width:0;padding:18px 18px 12px;border-right:none;border-bottom:1px solid var(--line);overflow:visible}
  .brand-sub{display:none}
  .search-wrap{margin-bottom:14px}
  .chip-row{margin-bottom:10px}
  .side-list{max-height:110px}
  .main{padding:18px 12px 70px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 6px}
  .card{max-width:none;flex-direction:row;padding:10px 8px}
  .info{height:112px;margin-left:12px}
  .detail .dhero{gap:18px}
  .dcover{width:112px;height:152px}
  .dtitle{font-size:19px}
  .rcontent{padding:56px 6% 80px;font-size:17px}
}
</style>
</head>
<body>
<div class="layout">
  <!-- 左侧栏：品牌 + 搜索 + 筛选 + 历史 + 工具 -->
  <aside class="sidebar">
    <div class="brand">阅读 · 小说下载助手</div>
    <div class="brand-sub">清风不识字，何故乱翻书</div>
    <div class="search-wrap">
      <input id="kw" class="search-input" placeholder="搜索书籍，在线多源聚合" autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
    <div class="side-label">结果筛选</div>
    <div class="chip-row" id="filters">
      <span class="chip active" data-f="all">全部</span>
      <span class="chip" data-f="exact">精确匹配<span class="n" id="n-exact"></span></span>
      <span class="chip" data-f="multi">多源<span class="n" id="n-multi"></span></span>
    </div>
    <div class="side-label">搜索历史</div>
    <div class="side-list" id="histlist"><div style="font-size:12px;color:var(--muted)">暂无历史</div></div>
    <div class="side-actions">
      <button class="side-btn" id="btn-sources">📚 书源管理</button>
      <button class="side-btn" id="btn-split">✂️ 文本分割</button>
      <button class="side-btn" id="btn-tasks">⏬ 下载任务</button>
      <button class="side-btn" id="btn-night">🌗 夜间模式</button>
    </div>
  </aside>

  <!-- 主内容区：搜索结果 / 详情页 -->
  <main class="main" id="main">
    <div id="loadbar" class="loading-bar hide"><i></i></div>

    <!-- 结果列表（默认视图） -->
    <section id="view-results">
      <div class="stopwrap hide" id="stopwrap"><button class="stopbtn" id="btn-stop">停止搜索</button></div>
      <div class="grid" id="grid"><div class="tip">输入书名开始全源搜索，同书自动聚合，点击卡片可换源。</div></div>
    </section>

    <!-- 书籍详情 -->
    <section id="view-detail" class="detail hide">
      <div class="backbar"><button class="backbtn" id="btn-back">← 返回</button></div>
      <div class="dhero">
        <img id="d-cover" class="dcover" alt="封面">
        <div class="dmeta">
          <div class="dtitle" id="d-title"></div>
          <div class="dinfo" id="d-info"></div>
          <div class="srcrow" id="d-srcrow"></div>
          <div class="dbtns">
            <button class="btn pri" id="btn-read">📖 开始阅读</button>
            <button class="btn" id="btn-toc">📋 目录</button>
            <button class="btn" id="btn-download">⬇️ 下载 TXT</button>
            <button class="btn" id="btn-swap">🔄 换源</button>
          </div>
        </div>
      </div>
      <div class="dintro" id="d-intro"></div>
    </section>
  </main>
</div>

<!-- 目录抽屉 -->
<div id="toc-mask" class="mask"></div>
<aside id="toc-drawer" class="drawer">
  <div class="drawer-hd">
    <div class="drawer-title">目录 <span id="toc-count" style="font-weight:400;color:var(--muted);font-size:12px"></span></div>
    <span class="reversedot" id="toc-reverse">↓ 倒序</span>
  </div>
  <div class="toclist" id="toc-list"><div class="tocload">加载中…</div></div>
</aside>

<!-- 阅读器 -->
<section id="reader" class="reader hide">
  <header class="rt-head">
    <button class="rt-btn" id="r-back">← 返回</button>
    <div class="rt-title" id="r-title"></div>
    <button class="rt-btn" id="r-cata">目录</button>
    <button class="rt-btn" id="r-setting">设置</button>
  </header>
  <article class="rcontent" id="r-content"></article>
  <footer class="rb-foot">
    <button class="rt-btn" id="r-prev">← 上一章</button>
    <span id="r-pos">1 / 1</span>
    <button class="rt-btn" id="r-next">下一章 →</button>
  </footer>
</section>

<!-- 换源弹窗 -->
<div id="swap-modal" class="modal-mask hide">
  <div class="modal">
    <div class="modal-hd">切换书源 <button id="swap-close" style="font-size:16px;color:var(--muted)">✕</button></div>
    <div class="modal-bd" id="swap-list"></div>
  </div>
</div>

<!-- 书源管理弹窗 -->
<div id="src-modal" class="modal-mask hide">
  <div class="modal">
    <div class="modal-hd">书源管理 <button id="src-close" style="font-size:16px;color:var(--muted)">✕</button></div>
    <div class="modal-bd">
      <div class="field"><label>导入：书源 JSON 链接或粘贴 JSON 文本</label>
        <textarea id="src-textarea" rows="4" placeholder="http://... 或 [{...}]，每行一个链接也支持"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn pri" id="btn-import" style="flex:1">导入书源</button>
        <button class="btn" id="btn-reload" style="flex:1">重新加载</button>
      </div>
      <div id="src-stats" style="font-size:12.5px;color:var(--muted);margin-bottom:10px"></div>
      <div id="src-files" style="font-size:12.5px;color:var(--sub);line-height:2;max-height:180px;overflow-y:auto;border-top:1px solid var(--line);padding-top:10px"></div>
    </div>
  </div>
</div>

<!-- 文本分割弹窗 -->
<div id="split-modal" class="modal-mask hide">
  <div class="modal">
    <div class="modal-hd">文本分割 <button id="split-close" style="font-size:16px;color:var(--muted)">✕</button></div>
    <div class="modal-bd">
      <div class="field"><label>文件名（保存到下载目录）</label><input id="split-name" value="split.txt"></div>
      <div class="field"><label>分割份数</label><input id="split-parts" type="number" value="3" min="2" max="99"></div>
      <div class="field"><label>文本内容</label><textarea id="split-text" rows="6" placeholder="粘贴要分割的长文本"></textarea></div>
      <button class="btn pri" id="btn-do-split" style="width:100%">开始分割</button>
    </div>
  </div>
</div>

<!-- 下载任务弹窗 -->
<div id="task-modal" class="modal-mask hide">
  <div class="modal">
    <div class="modal-hd">下载任务 <button id="task-close" style="font-size:16px;color:var(--muted)">✕</button></div>
    <div class="modal-bd" id="task-list" style="min-height:120px;font-size:13px"></div>
  </div>
</div>

<div id="toast"></div>
<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'"',"'":'&#39;'}[c]));
let toastTimer = null;
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), ms||2200);
}
const API_BASE = (() => {
  try{
    const {protocol, hostname} = location;
    if((protocol==='http:'||protocol==='https:') &&
       (hostname==='127.0.0.1'||hostname==='localhost'||hostname==='0.0.0.0')) return '';
  }catch(e){}
  return 'http://127.0.0.1:8765';
})();
function apiUrl(path){
  if(/^https?:\/\//i.test(path)) return path;
  return API_BASE + path;
}
async function api(path, opt){
  const url = apiUrl(path);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  try{
    const r = await fetch(url, Object.assign({mode:'cors', signal:ctrl.signal}, opt||{}));
    const text = await r.text();
    let j;
    try{ j = JSON.parse(text); }
    catch(e){ throw new Error('接口返回不是 JSON（HTTP '+r.status+'）'); }
    if(!j.success) throw new Error(j.message || ('HTTP '+r.status));
    return j;
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('请求超时，请确认本地服务已启动');
    const msg = String((e && e.message) || e || '');
    if(e && (e.name==='TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(msg))){
      throw new Error('连不上本地服务，请用 http://127.0.0.1:8765/ 打开本页');
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
const GET  = p => api(p);
const POST = (p,b) => api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});

/* ================= 全局状态 ================= */
const S = {
  filter: 'all',
  groups: [],
  rawCount: 0,
  jobId: null,
  searching: false,
  hist: [],
  detail: null,
  members: [],
  toc: [], tocAsc: true, curChapter: -1,
};
const HKEY = 'nd_hist_v2';

function saveHist(k){

/* ================= 相关性排序：精确 > 包含 > 其他；组内按完整度选代表 ================= */
function normKey(s){ return String(s||'').toLowerCase().replace(/[\s·˙:\-—_（）()《》【】\[\]""'‘’“”,，。!！?？]/g,''); }
function rankGroup(members, key){
  let best = 3;
  for(const m of members){
    const n = normKey(m.name), a = normKey(m.author);
    let r = 3;
    if(n === key || a === key) r = 0;
    else if(n.includes(key) || (key.length>=2 && n.length>=2 && key.includes(n))) r = 1;
    else if((a && a.includes(key)) || (m.kind && String(m.kind).includes(key))) r = 2;
    if(r < best) best = r;
    m._rank = r;
  }
  return best;
}
function pickRep(g){
  const score = m => (m._rank??3)*1000 + (m.cover?50:0) + (m.intro?30:0) + (m.author?20:0)
    + (m.last_chapter?15:0) + (m.kind?8:0) + (m.word_count?5:0) + (m.source_quality||0)*0.1;
  return [...g].sort((x,y)=>score(y)-score(x))[0];
}
function regroup(){
  const raw = window.__rawResults || [];
  const key = normKey(window.__searchKey||'');
  const map = new Map();
  for(const it of raw){
    if(!it.name) continue;
    const k = normKey(it.name)+'|'+normKey(it.author).slice(0,6);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  }
  const groups = Array.from(map.values());
  for(const g of groups){ g._rankV = rankGroup(g, key); g._rep = pickRep(g); }
  groups.sort((a,b)=> a._rankV-b._rankV || b.length-a.length);
  S.groups = groups; S.rawCount = raw.length;
}

/* ================= 结果渲染 ================= */
function coverHtml(b){
  var ch = esc((b.name||'?')[0]);
  if(!b.cover) return '<div class="cover-fb">'+ch+'</div>';
  return '<img class="cover-img" loading="lazy" data-init="'+ch+'" alt="'+ch+'" src="'+esc(b.cover)+'">';
}
/* 图片加载失败时换为占位封面：捕获阶段委托，避免内联引号嵌套 */
document.addEventListener('error', function(e){
  var t = e.target;
  if(t && t.classList && t.classList.contains('cover-img')){
    var d = document.createElement('div');
    d.className = 'cover-fb';
    d.textContent = t.getAttribute('data-init') || '?';
    t.replaceWith(d);
  }
}, true);
function cardHtml(gi){
  const g = S.groups[gi], b = g._rep, multi = g.length>1;
  const srcTag = multi ? (g.length+' 源') : esc(b.source_name||'未知书源');
  const tags = [
    b.kind ? '<span class="minitag">'+esc(String(b.kind).split(/[,，]/)[0])+'</span>' : '',
    b.word_count ? '<span class="minitag">'+esc(b.word_count)+'</span>' : '',
  ].join('');
  let html = '<div class="card" data-gi="'+gi+'">'
    + '<span class="nosrc">'+srcTag+'</span>'
    + coverHtml(b)
    + '<div class="info">'
    + '<div class="bname">'+esc(b.name)+'</div>'
    + '<div class="sub"><span class="author">'+esc(b.author||'佚名')+'</span>'
    + (tags ? '<span class="dot">·</span>'+tags : '')
    + '</div>';
  if(b.last_chapter) html += '<div class="last-chapter">'+esc(b.last_chapter)+'</div>';
  else if(b.intro)   html += '<div class="intro-line">'+esc(String(b.intro).replace(/<[^>]+>/g,''))+'</div>';
  html += '</div></div>';
  return html;
}
let __sig = '';
function renderResults(force){
  const grid = $('#grid');
  const sig = S.filter+'|'+S.groups.map(g=>g.length+':'+(g._rep&&g._rep.book_url||'')).join('|');
  if(!force && sig===__sig) return;
  __sig = sig;
  let shown = S.groups.map((g,i)=>i);
  if(S.filter==='exact') shown = shown.filter(i=>S.groups[i]._rankV<=1);
  if(S.filter==='multi') shown = shown.filter(i=>S.groups[i].length>1);
  $('#n-exact').textContent = '('+S.groups.filter(g=>g._rankV<=1).length+')';
  $('#n-multi').textContent = '('+S.groups.filter(g=>g.length>1).length+')';
  if(!shown.length){
    grid.innerHTML = '<div class="tip">'+(S.searching?'正在搜索，结果将实时出现…':'没有符合条件的结果')+'</div>';
    return;
  }
  grid.innerHTML = shown.map(cardHtml).join('');
  grid.querySelectorAll('.card').forEach(c => c.onclick = ()=> openDetail(+c.dataset.gi));
}

/* ================= 搜索流程：启动 → 轮询 → 停止 ================= */
let pollTimer = null;
function setSearching(on){
  S.searching = on;
  $('#stopwrap').classList.toggle('hide', !on);
  $('#loadbar').classList.toggle('hide', !on);
}
async function doSearch(){
  const key = $('#kw').value.trim();
  if(!key){ toast('请输入书名'); return; }
  if(S.searching) await stopSearch(true);
  try{
    const r = await POST('/api/search_start', {key, page:1});
    S.jobId = r.data.job_id;
    window.__rawResults = [];
    window.__searchKey = key;
    __sig = '';
    regroup(); renderResults(true);
    setSearching(true);
    saveHist(key);
    pollTimer = setInterval(pollOnce, 700);
    pollOnce();
  }catch(e){ toast('搜索启动失败：'+e.message); }
}
async function pollOnce(){
  if(!S.jobId) return;
  const jid = S.jobId;
  let j;
  try{ j = await GET('/api/search_poll?job_id='+encodeURIComponent(jid)); }
  catch(e){ return; }
  if(jid !== S.jobId) return;
  window.__rawResults = j.data.results || [];
  regroup();
  renderResults(false);
  $('#loadbar').firstElementChild.style.width =
    Math.max(8, Math.round((j.data.done/(j.data.total||1))*100)) + '%';
  if(j.data.finished || j.data.cancelled){
    clearInterval(pollTimer); pollTimer = null;
    S.jobId = null;
    setSearching(false);
    renderResults(true);
    $('#loadbar').classList.add('hide');
    const nExact = S.groups.filter(g=>g._rankV<=1).length;
    toast('搜索完成：'+S.groups.length+' 组结果'+(nExact?('，精确匹配 '+nExact):''), 2600);
  }
}
async function stopSearch(silent){
  clearInterval(pollTimer); pollTimer = null;
  const jid = S.jobId; S.jobId = null; setSearching(false);
  if(jid){ try{ await POST('/api/search_cancel', {job_id:jid}); }catch(e){} }
  if(!silent) toast('已停止');
}

function pickMembers(list){
  // 同书多源：按名称+作者归并（与卡片分组一致）

async function openDetail(gi){
  const g = S.groups[gi];

  S.members = [...g].sort((a,b)=>(b.source_quality||0)-(a.source_quality||0));
  // 先用最佳成员的搜索数据占位，再异步补全详情字段
  const best = pickRep(g);

    source_id: best.source_id, book_url: best.book_url,
    name: best.name, author: best.author||'', intro:'',
    cover_url: best.cover||'', kind: best.kind||'',

  };

    const r = await GET('/api/detail?source_id='+encodeURIComponent(S.detail.source_id)
      +'&book_url='+encodeURIComponent(S.detail.book_url));
    Object.assign(S.detail, r.data || {});
    renderDetail();
  }catch(e){ toast('详情加载失败：'+e.message); }
}
function currentMember(){
  return S.members.find(m => m.source_id===S.detail.source_id && m.book_url===S.detail.book_url);
}
function renderDetail(){

    row.innerHTML = '同书多源('+S.members.length+')：' + S.members.map((m,i)=>

function applySourceDetail(m){
  S.detail = {
    source_id:m.source_id, book_url:m.book_url,
    name:m.name||S.detail.name, author:m.author||'',
    intro:'', cover_url:m.cover||'', kind:m.kind||'',
    toc_url:'', last_chapter:m.last_chapter||'', word_count:m.word_count||'',
  };

function switchSource(mi){
  const m = S.members[mi]; if(!m) return;

  applySourceDetail(m);

      +'</div></div>').join('')
      : '<div class="tocload">暂无任务</div>';
  }catch(e){ $('#task-list').innerHTML = '<div class="tocload">加载失败</div>'; }
};
$('#task-close').onclick = ()=> closeModal('#task-modal');
['#src-modal','#split-modal','#task-modal'].forEach(id=>{
  $(id).addEventListener('click', e=>{ if(e.target.id===id.slice(1)) closeModal(id); });
});

/* ================= 全局绑定 & 启动 ================= */
$('#kw').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
$('#btn-stop').onclick = ()=> stopSearch(false);
document.querySelectorAll('.chip[data-f]').forEach(c=> c.onclick = ()=>{
  document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); S.filter = c.dataset.f; renderResults(true);
});
$('#btn-back').onclick = ()=>{ showView('results'); history.replaceState(null,'',' '); };
$('#btn-toc').onclick = openToc;
$('#btn-swap').onclick = openSwapModal;
$('#btn-read').onclick = ()=> openReader(Math.max(0,S.curChapter));
window.addEventListener('keydown', e=>{
  const rd = !$('#reader').classList.contains('hide');
  if(rd && e.key==='ArrowLeft' ) $('#r-prev').click();
  if(rd && e.key==='ArrowRight') $('#r-next').click();
});
$('#btn-night').onclick = ()=>{
  document.documentElement.classList.toggle('night');
  localStorage.setItem('nd_night', document.documentElement.classList.contains('night')?'1':'0');
};
if(localStorage.getItem('nd_night')==='1') document.documentElement.classList.add('night');
document.body.classList.add('reading-hide-ui-off');
loadHist();
refreshSourcesCountHack();
async function refreshSourcesCountHack(){
  try{
    const r = await GET('/api/sources?brief=1');
    $('.brand-sub').textContent = '共 '+r.data.total+' 个书源 · 可用 '+r.data.usable+' 个';
  }catch(e){
    $('.brand-sub').textContent = '未连上本地服务';
    toast('未连上本地服务，请用 http://127.0.0.1:8765/ 打开本页', 4200);
  }
}</script>
</body>
</html>
