name: Publish deployment package to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dist novel-package.zip
          mkdir -p .dist
          cp -r rule_engine.py source_manager.py server.py downloader.py index.html requirements.txt config.json sources scripts .dist/
          rm -rf .dist/sources/builtin/*.bak .dist/__pycache__ .dist/scripts/__pycache__
          git rev-parse HEAD > .dist/VERSION
          (cd .dist && zip -qr ../novel-package.zip .)
          sha256sum novel-package.zip > novel-package.zip.sha256
      - name: Upload to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          python -m pip install --disable-pip-version-check oss2
          python - <<'PY'
          import json, os, oss2
          endpoint=os.environ['OSS_ENDPOINT']
          bucket_name=os.environ['OSS_BUCKET']
          auth=oss2.Auth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'])
          bucket=oss2.Bucket(auth, endpoint, bucket_name)
          with open('novel-package.zip','rb') as f: bucket.put_object('novel/latest.zip', f)
          with open('novel-package.zip.sha256','rb') as f: bucket.put_object('novel/latest.zip.sha256', f)
          manifest={'sha':os.environ['GITHUB_SHA'],'package':'novel/latest.zip'}
          bucket.put_object('novel/latest.json', json.dumps(manifest).encode())
          print('published', manifest['sha'])
          PY
