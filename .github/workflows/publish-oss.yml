name: Publish deployment package to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dist novel-package.zip
          mkdir -p .dist
          [ -f config.json ] || echo '{}' > config.json
          cp -r rule_engine.py source_manager.py server.py downloader.py tomato_source.py index.html requirements.txt config.json sources scripts .dist/
          rm -rf .dist/sources/builtin/*.bak .dist/__pycache__ .dist/scripts/__pycache__
          git rev-parse HEAD > .dist/VERSION
          (cd .dist && zip -qr ../novel-package.zip .)
          sha256sum novel-package.zip > novel-package.zip.sha256
      - name: Upload to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          for v in OSS_ENDPOINT OSS_BUCKET OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ${v} 未配置：Settings → Secrets and variables → Actions 添加后重跑"
              exit 1
            fi
          done
          python -m pip install --disable-pip-version-check oss2
          BUCKET_HOST="${OSS_BUCKET}.${OSS_ENDPOINT}"
          IP=""
          for SUB in 101.80.0.0/16 111.0.0.0/16 116.16.0.0/16 220.181.0.0/16 39.96.0.0/16; do
            RAW=$(curl -sm 20 "https://223.5.5.5/resolve?name=${BUCKET_HOST}&type=A&edns_client_subnet=${SUB}" || true)
            IP=$(echo "$RAW" | python3 -c 'import sys,json; a=(json.load(sys.stdin).get("Answer") or []); print(a[0]["data"] if a else "")' 2>/dev/null || true)
            if [ -n "$IP" ]; then echo "alidns_hit subnet=${SUB} ip=${IP}"; break; fi
          done
          if [ -z "$IP" ]; then
            RAW2=$(curl -sm 20 "https://dns.google/resolve?name=${BUCKET_HOST}&type=A" || echo CURL_ERR=$?)
            echo "dnsgoogle_raw=$(echo "$RAW2" | head -c 300)"
            IP=$(echo "$RAW2" | python3 -c 'import sys,json; a=(json.load(sys.stdin).get("Answer") or []); print(a[0]["data"] if a else "")' 2>/dev/null || true)
          fi
          if [ -z "$IP" ]; then
            echo "fallback_pin=118.31.219.207 (authoritative CN view; global DNS may lag after bucket creation)"
            IP="118.31.219.207"
          fi
          echo "oss_dns_ip=${IP:-none}"
          if [ -n "$IP" ]; then
            echo "$IP ${BUCKET_HOST}" | sudo tee -a /etc/hosts > /dev/null
            echo "hosts_pinned=true"
          fi
          python - <<'PY'
          import json, os, socket, time, oss2
          endpoint=os.environ['OSS_ENDPOINT'].strip()
          if not endpoint.startswith('http'):
              endpoint='https://'+endpoint
          bucket_name=os.environ['OSS_BUCKET'].strip()
          aki=os.environ['OSS_ACCESS_KEY_ID'].strip()
          aks=os.environ['OSS_ACCESS_KEY_SECRET'].strip()
          host = bucket_name + '.' + endpoint.split('://', 1)[1]
          for attempt in range(4):
              try:
                  infos=socket.getaddrinfo(host,443)
                  print('dns_ok addrs=%d attempt=%d' % (len(infos),attempt))
                  break
              except OSError as e:
                  print('dns_fail attempt=%d err=%s' % (attempt,e))
                  time.sleep(4*(attempt+1))
          else:
              raise SystemExit('DNS resolve failed after retries')
          auth=oss2.Auth(aki, aks)
          last=None
          for attempt in range(5):
              scheme='https' if attempt % 2 == 0 else 'http'
              try:
                  bucket=oss2.Bucket(auth, scheme+'://'+endpoint.split('://',1)[1], bucket_name,
                                     connect_timeout=60)
                  with open('novel-package.zip','rb') as f:
                      bucket.put_object('novel/latest.zip', f)
                  print('upload_ok scheme=%s attempt=%d' % (scheme, attempt))
                  last=None
                  break
              except oss2.exceptions.RequestError as e:
                  last=e
                  print('upload_retry scheme=%s attempt=%d' % (scheme, attempt))
                  time.sleep(6*(attempt+1))
          if last is not None:
              raise last
          bucket=oss2.Bucket(auth, endpoint, bucket_name, connect_timeout=60)
          with open('novel-package.zip.sha256','rb') as f:
              bucket.put_object('novel/latest.zip.sha256', f)
          manifest={'sha':os.environ['GITHUB_SHA'],'package':'novel/latest.zip'}
          bucket.put_object('novel/latest.json', json.dumps(manifest).encode())
          print('published', manifest['sha'])
          PY
